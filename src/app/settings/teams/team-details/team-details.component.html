<gt-top-app-bar>
  <ng-container slot="left">
    <gt-back-link i18n-backLinkText backLinkText="Teams" />
  </ng-container>
</gt-top-app-bar>
<section class="l-body">
  <gt-page-header icon="groups" [title]="'#' + teamSlug()" compact>
    @if (team(); as team) {
      <span slot="meta">
        <span i18n>Created {{ team.dateCreated | date: "mediumDate" }}</span>
      </span>
    }
  </gt-page-header>
  <nav mat-tab-nav-bar mat-stretch-tabs="false" [tabPanel]="tabPanel">
    @for (link of navLinks; track link) {
      <a
        mat-tab-link
        [routerLink]="link.path"
        routerLinkActive
        [active]="rla.isActive"
        #rla="routerLinkActive"
        >{{ link.label }}
        @if (tabCounts()[link.path] !== undefined) {
          <span class="tab-count">{{ tabCounts()[link.path] }}</span>
        }
      </a>
    }
  </nav>
  <mat-tab-nav-panel #tabPanel>
    <router-outlet></router-outlet>
  </mat-tab-nav-panel>
</section>
