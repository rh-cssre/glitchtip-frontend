<gt-top-app-bar>
  <ng-container slot="left">
    <h1 class="section-header-text">Organization Members</h1>
  </ng-container>
  <ng-container slot="right">
    <a
      mat-flat-button
      color="primary"
      [routerLink]="['new']"
      [disabled]="!accessMemberWrite()"
      >Invite Member</a
    >
  </ng-container>
</gt-top-app-bar>
<section class="l-body">
  <gt-list>
    @for (member of members(); track member) {
      <gt-list-row>
        <a [routerLink]="[member.id]">{{ member.email }}</a>
        @if (member.isOwner) {
          <mat-chip class="caption-text" color="primary" highlighted="true" i18n
            >Account owner</mat-chip
          >
        }
        @if (member.pending) {
          <mat-chip class="caption-text" color="primary" i18n
            >Invite pending</mat-chip
          >
        }
        <span slot="meta">{{ member.roleName }}</span>
        @if (member.pending) {
          <ng-container slot="actions">
            <button
              mat-icon-button
              class="medium-icon-button"
              [matMenuTriggerFor]="memberMenu"
              [attr.aria-label]="'Actions for ' + member.email"
            >
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #memberMenu="matMenu" xPosition="before">
              <button
                mat-menu-item
                [disabled]="member.sentResendInvite"
                (click)="resendInvite(member)"
              >
                @if (member.sentResendInvite) {
                  <ng-container i18n>Invite resent</ng-container>
                } @else {
                  <ng-container i18n>Resend invite</ng-container>
                }
              </button>
              <button mat-menu-item (click)="removeMember(member)" i18n
                >Remove</button
              >
            </mat-menu>
          </ng-container>
        } @else {
          <gt-loading-button
            slot="actions"
            matTooltip="Account ownership must be transferred."
            [matTooltipDisabled]="!member.isOwner"
            [disabled]="member.isOwner"
            (buttonClick)="removeMember(member)"
            [buttonText]="member.isMe ? 'Leave' : 'Remove'"
            buttonStyle="stroked"
          />
        }
      </gt-list-row>
    }
  </gt-list>
</section>
