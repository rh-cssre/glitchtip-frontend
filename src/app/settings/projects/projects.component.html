<gt-top-app-bar>
  <ng-container slot="left">
    <h1 class="gt-bar-title" i18n>Projects</h1>
  </ng-container>
  <ng-container slot="right">
    @if (canWriteProject()) {
      <a mat-flat-button [routerLink]="['new']" color="primary" i18n
        >Create New Project</a
      >
    }
  </ng-container>
</gt-top-app-bar>
<section class="l-body">
  <div>
    @if (hasError()) {
      @for (error of errors(); track $index) {
        <p>{{ error.msg || error }}</p>
      }
    } @else if (projects()?.length === 0) {
      <gt-empty-projects
        [activeOrgOnly]="true"
        [canCreateProject]="canWriteProject()"
      ></gt-empty-projects>
    }
  </div>
  <div class="project-card-wrapper">
    @for (project of projects(); track project) {
      <gt-project-card
        [cardLink]="project.slug!"
        [title]="project.name"
        [descriptionList]="[
          { key: organizationText, value: activeOrganization()?.name || '' },
          { key: dateCreatedText, value: (project.dateCreated | date)! },
        ]"
        [isMember]="project.isMember"
        [secondaryButton]="{
          link: project.slug!,
          icon: 'settings',
          text: settingsText,
        }"
      ></gt-project-card>
    }
  </div>
</section>
