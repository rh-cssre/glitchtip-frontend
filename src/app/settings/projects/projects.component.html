<gt-top-app-bar>
  <ng-container slot="left">
    <h1 class="gt-bar-title" i18n>Projects</h1>
  </ng-container>
  <ng-container slot="right">
    @if (canWriteProject()) {
      <a mat-flat-button [routerLink]="['new']" color="primary" i18n
        >New project</a
      >
    }
  </ng-container>
</gt-top-app-bar>
<section class="l-body">
  @if (hasError()) {
    @for (error of errors(); track $index) {
      <p>{{ error.msg || error }}</p>
    }
  } @else if (projects()?.length === 0) {
    <gt-panel>
      <gt-empty-state
        icon="dashboard"
        i18n-title
        title="No projects yet"
        [headingLevel]="2"
        [message]="canWriteProject() ? noProjectsCanCreate : noProjectsAskOwner"
      />
    </gt-panel>
  } @else if (projects(); as projects) {
    <gt-project-rows
      [projects]="projects"
      [orgSlug]="orgSlug()"
      opensSettings
    />
  }
</section>
