<form
  [formGroup]="commentForm"
  #formDirective="ngForm"
  (ngSubmit)="submitComment(formDirective)"
>
  <mat-form-field appearance="outline">
    <mat-label>@if (comment()) {<ng-container i18n>Update Comment</ng-container>} @else {<ng-container i18n>Comment</ng-container>}</mat-label>
    <textarea matInput formControlName="text" required></textarea>
    <mat-hint i18n>Markdown supported</mat-hint>
    @if (commentFormText.errors?.required) {
      <mat-error i18n> Enter comment text. </mat-error>
    }
  </mat-form-field>
  <div class="buttons">
    <gt-loading-button
      class="submit-button"
      [disabled]="disableSubmissions()"
      [loading]="loading()"
      [buttonText]="comment() ? updateCommentText : submitCommentText"
    >
    </gt-loading-button>
    @if (comment()) {
      <button i18n
        class="cancel-button"
        (click)="emitCancelUpdate()"
        mat-button
        type="button"
        >Cancel</button
      >
    }
  </div>
</form>
