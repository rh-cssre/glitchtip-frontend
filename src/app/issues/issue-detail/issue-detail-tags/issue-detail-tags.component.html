@if (rankedTags(); as tags) {
  @if (tags.length) {
    <mat-card appearance="outlined">
      <mat-card-content>
        <h3 i18n class="body-text-strong">Tags</h3>
        <ul class="tag-rows">
          @for (tag of tags; track tag.key) {
            @let top = tag.topValues[0];
            <li>
              <a
                class="tag-row"
                [class.tag-row--single]="tag.uniqueValues <= 1"
                [routerLink]="['/', orgSlug(), 'issues']"
                [queryParams]="tagQuery(tag.key, top.value)"
              >
                <span class="tag-row__head">
                  <span class="tag-row__key">{{ tag.key }}</span>
                  <span class="tag-row__value">{{ top.value }}</span>
                  @if (tag.uniqueValues > 1) {
                    <span class="tag-row__pct">{{ top.percentRounded }}%</span>
                  }
                </span>
                @if (tag.uniqueValues > 1) {
                  <span class="tag-row__track" aria-hidden="true">
                    <span
                      class="tag-row__fill"
                      [style.width.%]="top.percentRounded"
                    ></span>
                  </span>
                }
              </a>
            </li>
          }
        </ul>
      </mat-card-content>
    </mat-card>
  }
}
