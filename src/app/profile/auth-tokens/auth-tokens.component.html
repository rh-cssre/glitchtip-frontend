@if (initialLoad() === true) {
  <!-- A visible title would only repeat the bar title. -->
  <gt-settings-section
    i18n-title
    title="Tokens"
    hideTitle
    panel
    [flush]="!!authTokens()?.length"
  >
    <span slot="description" i18n
      >Tokens let scripts and tools use the GlitchTip API, with only the scopes
      you give them.</span
    >
    @if (authTokens()?.length) {
      <gt-list flush>
        @for (authToken of authTokens(); track authToken.id) {
          <gt-list-row>
            <span [id]="'token-label-' + authToken.id">{{
              authToken.label
            }}</span>
            <span slot="description">{{ scopesLabel(authToken.scopes) }}</span>
            <gt-copy-input
              slot="description"
              class="token-value"
              [value]="authToken.token!"
              [labelledBy]="'token-label-' + authToken.id"
            />
            <gt-loading-button
              slot="actions"
              i18n-buttonText
              buttonText="Delete"
              buttonStyle="stroked"
              [ariaLabel]="deleteLabel(authToken.label)"
              [loading]="authToken.isLoading"
              (buttonClick)="deleteAuthToken(authToken.id!, authToken.label)"
            />
          </gt-list-row>
        }
      </gt-list>
    } @else {
      <gt-empty-state
        icon="vpn_key"
        i18n-title
        title="No tokens"
        i18n-message
        message="Create a token to use the GlitchTip API."
      />
    }
  </gt-settings-section>
}
