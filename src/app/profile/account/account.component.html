<gt-preferences />
<gt-change-password />
<gt-manage-emails />
<gt-social-auth />

<gt-settings-section
  i18n-title
  title="Delete account"
  panel
  tone="danger"
>
  <span slot="description" i18n
    >You lose access to every organization you belong to. Transfer or delete the
    organizations you own first; owners of a paid subscription can't delete
    their account.</span
  >
  @if (userDeleteError(); as error) {
    <gt-form-error slot="error" [errors]="error" />
  }
  <gt-loading-button
    slot="actions"
    i18n-buttonText
    buttonText="Delete account"
    buttonStyle="stroked"
    color="warn"
    [loading]="userDeleteLoading() === true"
    (buttonClick)="deleteUser()"
    id="delete-user"
  />
</gt-settings-section>
