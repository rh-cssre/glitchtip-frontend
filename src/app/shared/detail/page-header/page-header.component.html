<header class="page-header">
  @if (icon()) {
    <div class="page-header__icon" aria-hidden="true">
      <mat-icon>{{ icon() }}</mat-icon>
    </div>
  }
  <div class="page-header__text">
    <h1
      class="page-header__title section-header-text"
      [class.page-header__title--mono]="titleMono()"
    >
      {{ title() }}
    </h1>
    <div class="page-header__meta">
      @if (status(); as status) {
        <gt-status-pill
          class="page-header__pill"
          [label]="status"
          [color]="statusColor()"
        />
      }
      <ng-content select="[slot=meta]" />
    </div>
  </div>
</header>
