<button mat-stroked-button [matMenuTriggerFor]="menu">
  <span class="status-content">
    @if (statusColor(); as color) {
      <span
        class="status-dot"
        aria-hidden="true"
        [style.background-color]="color"
      ></span>
    }
    <span class="status-label">
      <span>{{ buttonLabel() }}</span>
      @for (option of options; track option.value) {
        <span class="status-label__sizer" aria-hidden="true">{{
          option.label
        }}</span>
      }
    </span>
  </span>
  <mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
</button>
<mat-menu #menu="matMenu">
  @for (option of options; track option.value) {
    <button mat-menu-item (click)="selectStatus(option.value)">
      {{ option.label }}
      <mat-icon [class.invisible]="!isActive(option.value)">done</mat-icon>
    </button>
  }
  <mat-divider />
  <button mat-menu-item (click)="resolveInNextReleaseSelected.emit()">
    <span i18n>Resolve in next release</span>
    <mat-icon [class.invisible]="!resolvedInRelease()">done</mat-icon>
  </button>
</mat-menu>
