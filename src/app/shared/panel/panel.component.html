<div class="gt-panel__header">
  @if (title()) {
    <div
      class="gt-panel__title"
      role="heading"
      [attr.aria-level]="headingLevel()"
      [id]="titleId"
    >
      <span class="gt-panel__title-text">{{ title() }}</span>
      @if (subtitle()) {
        <span class="gt-panel__subtitle" [title]="subtitle()">{{
          subtitle()
        }}</span>
      }
    </div>
  } @else {
    <div class="gt-panel__lead"><ng-content select="[slot=lead]" /></div>
  }
  <div class="gt-panel__actions">
    <ng-content select="[slot=actions]" />
  </div>
</div>
<div class="gt-panel__body" [class.gt-panel__body--flush]="flush()">
  <ng-content />
</div>
<div class="gt-panel__footer">
  <div class="gt-panel__hint">
    <ng-content select="[slot=footer-hint]" />
  </div>
  <div class="gt-panel__footer-actions">
    <ng-content select="[slot=footer]" />
  </div>
</div>
