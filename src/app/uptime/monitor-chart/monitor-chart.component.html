<div>
  @for (datapoint of data(); track datapoint.startCheck) {
    @if (datapoint) {
      @if (datapoint.isUp) {
        <div i18n-matTooltip
          class="up-check"
          matTooltip="Up at {{ datapoint.startCheck | date: 'short' }}"
          matTooltipPosition="above"
        ></div>
      }
      @if (datapoint.isUp === false) {
        <div i18n-matTooltip
          class="down-check"
          matTooltip="{{
            datapoint.reason ? convertReasonText(datapoint.reason) : downText
          }} at {{ datapoint.startCheck | date: 'short' }}"
          matTooltipPosition="above"
        ></div>
      }
    }
  }
  @for (emptyCheck of emptyChecks; track $index) {
    <div class="no-check"></div>
  }
</div>
