<gt-top-app-bar>
  <ng-container slot="left">
    @if (monitor(); as monitor) {
      <gt-back-link [backLinkText]="monitor.name" />
    }
  </ng-container>
</gt-top-app-bar>
<section class="l-body">
  @if (monitor(); as monitor) {
    <gt-page-header i18n-title title="Edit monitor" />
    <gt-monitor-form
      [monitorSettings]="monitor"
      [loading]="loading() === true"
      [formError]="error()"
      (formSubmitted)="submit($event)"
    ></gt-monitor-form>

    @if (canWriteProject()) {
      <gt-settings-section
        i18n-title
        title="Delete monitor"
        panel
        tone="danger"
      >
        <span slot="description" i18n
          >Deletes <strong>{{ monitor.name }}</strong> and its check history.
          This cannot be undone.</span
        >
        @if (deleteError()) {
          <gt-form-error [errors]="deleteError()" />
        }
        <gt-loading-button
          slot="actions"
          i18n-buttonText
          buttonText="Delete monitor"
          buttonStyle="stroked"
          color="warn"
          [loading]="deleteLoading()"
          (buttonClick)="delete()"
          id="delete-monitor"
        />
      </gt-settings-section>
    }
  }
</section>
