<gt-top-app-bar>
  <ng-container slot="left">
    @if (monitor(); as monitor) {
      <gt-back-link [backLinkText]="monitor.name" />
    }
  </ng-container>

  <ng-container slot="right">
    <button
      mat-icon-button
      class="medium-icon-button"
      id="delete-monitor"
      aria-label="Delete monitor"
      i18n-aria-label
      (click)="delete()"
    >
      <mat-icon>delete</mat-icon>
    </button>
  </ng-container>
</gt-top-app-bar>
<section class="l-body">
  @if (monitor(); as monitor) {
    <gt-monitor-form
      [monitorSettings]="monitor"
      [loading]="loading() === true"
      [formError]="error()"
      (formSubmitted)="submit($event)"
    ></gt-monitor-form>
  }
</section>
